
# Terminal & Colors
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh btop htop'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Sensible defaults
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
set -g renumber-windows on

# Start count from 1
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on

# Clipboard & Mouse
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Selection with 'v' and yank with 'y'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Sessions
bind S new-session

# Splits
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Pane Resizing (Shift + H/J/K/L)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Status Bar
set -g status-position top
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# TPM Initialization
run '~/.tmux/plugins/tpm/tpm'

# Overrides (after TPM so catppuccin doesn't clobber them)
set -g status-style "bg=default,fg=#c0caf5"
set -g pane-border-lines heavy
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#a6adc8"
set -g pane-border-status top
set -g pane-border-format ""
set -g window-style "bg=default"
set -g window-active-style "bg=default"
